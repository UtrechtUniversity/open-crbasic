[project]
name = "opencrbasic"
version = "1.2.1"
description = "Open-source re-implementation of the Campbell Scientific CRBasic pre-compilers (CR6, CR1000X, CR300, CR350)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Utrecht University" }]
requires-python = ">=3.15"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Compilers",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/UtrechtUniversity/open-crbasic"

[project.optional-dependencies]
# The language server (`crbc-lsp`, docs/lsp-api.md "Language server (LSP-01)"); the compiler
# itself has no runtime dependencies.
lsp = ["pygls>=2.1.1,<3"]

[project.scripts]
crbc = "opencrbasic.cli:main"
crbc-lsp = "opencrbasic.lsp.server:main"

[dependency-groups]
# `uv sync` installs `dev` by default: the test runner and the reverse-engineering tools
# (`tools/extract_tables.py`, `tools/message_catalog.py` read the exe with pefile), and pygls
# so the suite can test the language server; pytest-xdist for parallel test runs (`-n`); pyrefly
# checks the repository (`[tool.pyrefly]`); pre-commit runs ruff and pyrefly before each commit;
# openloggernet drives a logger for `tools/logger_oracle.py`.
dev = [
    "pytest>=8",
    "pefile>=2024.8.26",
    "pygls>=2.1.1,<3",
    "pytest-xdist>=3.6",
    "pyrefly==1.3.1",
    "pre-commit>=4",
    "openloggernet>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencrbasic"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
addopts = "--strict-markers --dist worksteal"
markers = [
    "slow: corpus sweeps and other tests above ~3 s; skip with -m 'not slow' for the fast tier",
    "server: tests that start the language server as a subprocess; run alone with -m server",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["tests/corpus", "tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
# B023: closures here are called within the loop iteration that defines them;
# B009/B010: getattr/setattr reach attributes the type checker cannot see (pefile, dataclass extras)
ignore = ["E702", "E731", "E741", "B009", "B010", "B023", "B905"]

[tool.ruff.lint.per-file-ignores]
# F811: pytest fixtures imported into a test module; E402: sys.path set up before an import
"tests/**" = ["F811", "E402", "B008", "B017"]
"tools/**" = ["E402"]

[tool.pyrefly]
preset = "default"
python-version = "3.15"
python-platform = "linux"  # as CI checks it; a Windows host lacks resource.getrusage and os.killpg
project-includes = ["src", "tools", "tests"]
search-path = ["src", "tools", "tests/lsp"]
project-excludes = ["tests/corpus", "tests/fixtures"]
