[project]
name = "opencrbasic"
version = "0.0.1"
description = "Open-source re-implementation of the Campbell Scientific CRBasic pre-compilers (CR6, CR1000X, CR300, CR350)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
crbc = "opencrbasic.cli:main"

[dependency-groups]
# `uv sync` installs `dev` by default: the test runner and the reverse-engineering tools
# (`tools/extract_tables.py`, `tools/message_catalog.py` read the exe with pefile).
dev = ["pytest>=8", "pefile>=2024.8.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencrbasic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
