[project]
name = "opencrbasic"
version = "0.0.1"
description = "Open-source re-implementation of the Campbell Scientific CRBasic pre-compilers (CR6, CR1000X, CR300, CR350)"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[project.optional-dependencies]
# The language server (`crbc-lsp`, docs/lsp-rounds/LSP-00.md "Package boundaries"); the compiler
# itself has no runtime dependencies.
lsp = ["pygls>=2.1.1,<3"]

[project.scripts]
crbc = "opencrbasic.cli:main"
crbc-lsp = "opencrbasic.lsp.server:main"

[dependency-groups]
# `uv sync` installs `dev` by default: the test runner and the reverse-engineering tools
# (`tools/extract_tables.py`, `tools/message_catalog.py` read the exe with pefile), and pygls
# so the suite can test the language server; pytest-xdist for parallel test runs (`-n`); pyrefly
# type-checks the language-server modules (`[tool.pyrefly]`).
dev = [
    "pytest>=8",
    "pefile>=2024.8.26",
    "pygls>=2.1.1,<3",
    "pytest-xdist>=3.6",
    "pyrefly==1.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencrbasic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
addopts = "--strict-markers"
markers = [
    "slow: corpus sweeps and other tests above ~3 s; skip with -m 'not slow' for the fast tier",
    "server: tests that start the language server as a subprocess; run alone with -m server",
]

[tool.pyrefly]
# Type checking for the language-server code (docs/lsp-rounds/LSP-08.md "LSP-08e"); the compiler
# modules are not in scope for this gate. Run: `uv run --no-sync pyrefly check`.
preset = "default"
python-version = "3.15"
search-path = ["src"]
project-includes = [
    "src/opencrbasic/lsp/**/*.py",
    "src/opencrbasic/analysis.py",
    "src/opencrbasic/sources.py",
    "src/opencrbasic/positions.py",
    "src/opencrbasic/editing.py",
    "src/opencrbasic/hover.py",
    "src/opencrbasic/navigation.py",
    "src/opencrbasic/bindings.py",
    "src/opencrbasic/catalog.py",
    "src/opencrbasic/helpdocs.py",
    "src/opencrbasic/rename.py",
    "src/opencrbasic/formatting.py",
    "src/opencrbasic/quickfix.py",
    "src/opencrbasic/commands.py",
    "src/opencrbasic/inlay.py",
]
